# Add these to the http block of /opt/proxy/nginx.conf, then reload nginx.
server {
    listen 80;
    server_name api.legitfy.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.legitfy.dev;

    ssl_certificate     /etc/nginx/certs/api.legitfy.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/api.legitfy.dev/privkey.pem;

    # Uploads can be 15 MB, plus the rest of the form.
    client_max_body_size 16m;

    # Docker's DNS, so nginx still starts while this app is down.
    resolver 127.0.0.11 valid=30s;
    set $legitfy http://legitfy:8787;

    location / {
        proxy_pass $legitfy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replaces what the client sent, so rate limiting can't be dodged by forging it.
        # If Cloudflare proxies this domain, add these or every visitor shares one limit:
        #   set_real_ip_from <each Cloudflare IP range>;
        #   real_ip_header CF-Connecting-IP;
        proxy_set_header X-Forwarded-For $remote_addr;
        # The AI assistant reads a document while the upload waits.
        proxy_read_timeout 120s;
    }
}
